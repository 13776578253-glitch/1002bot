# Operator-owned deployment; World never invokes this Compose file.
services:
  snowluma:
    image: ${SNOWLUMA_IMAGE:?Set a verified tag and sha256 digest}
    container_name: snowluma
    restart: unless-stopped
    shm_size: 1gb
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp=unconfined]
    ulimits:
      nofile: { soft: 65536, hard: 1048576 }
    environment:
      SNOWLUMA_ACCEPT_EULA: ${SNOWLUMA_ACCEPT_EULA:?Read and accept deployment terms}
      SNOWLUMA_ACCEPT_PRIVACY: ${SNOWLUMA_ACCEPT_PRIVACY:?Read and accept deployment privacy terms}
      SNOWLUMA_ONEBOT_HOST: 0.0.0.0
      SNOWLUMA_HOOK_AUTOLOAD: 1
      SNOWLUMA_QQ_FLAGS: --disable-gpu --disable-software-rasterizer --disable-gpu-compositing
    ports:
      - 127.0.0.1:3001:3001
      - 127.0.0.1:5099:5099
      - 127.0.0.1:6081:6081
    volumes:
      - qq-gateway-data:/app/data
      - qq-client-config:/app/.config
      - qq-client-data:/app/.local/share
volumes:
  qq-gateway-data:
  qq-client-config:
  qq-client-data:
